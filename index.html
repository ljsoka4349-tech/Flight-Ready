<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0a1222">
  <title>Flight Ready · 객실 사고사례 훈련</title>
  <link rel="stylesheet" href="css/app.css">
</head>
<body>
  <!-- 홈: 사고사례 목록 -->
  <section id="home" class="screen">
    <header class="top">
      <div class="brand">FLIGHT<span>READY</span></div>
      <div class="top-actions">
        <a href="guide.html" class="icon-btn">설명서</a>
        <button id="settingsBtn" class="icon-btn" aria-label="설정">설정</button>
      </div>
    </header>
    <h1 class="h1">객실 사고사례 훈련</h1>
    <p class="muted">영상을 보다가 멈추는 지점에서 직접 판단해 보세요.</p>
    <div id="caseList" class="case-list"></div>

    <h2 class="h2">직접 지휘해 보기</h2>
    <button class="sim-card" data-open-sim>
      <div class="sim-card-art" aria-hidden="true"><i></i><i></i><i></i><i></i><b></b></div>
      <div class="body">
        <div class="no">비상탈출 시뮬레이션</div>
        <div class="t">객실 책임 승무원이 되어 140명을 탈출시키세요</div>
        <div class="muted">벨트 점검 → 충격 대비 → 출구 판단 → 탈출 지휘. 판단마다 결과가 달라집니다.</div>
        <div class="meta"><span class="pill">시나리오 3종 + 무작위</span><span class="pill">약 3분</span><span class="pill">AI 교관 해설</span></div>
      </div>
    </button>
  </section>

  <!-- 비상탈출 시뮬레이션 -->
  <section id="sim" class="screen hidden">
    <header class="top">
      <button id="simBack" class="icon-btn" aria-label="목록으로">← 목록</button>
      <div class="player-title">비상탈출 시뮬레이션</div>
      <div class="top-actions"><span id="simClock" class="mono sim-clock"></span><button id="simSound" class="icon-btn" aria-pressed="false">소리 켜짐</button></div>
    </header>
    <div id="simSteps" class="sim-steps"></div>
    <div id="simMain" class="sim-layout">
      <div class="sim-stage">
        <div id="simBanner" class="sim-banner hidden"></div>
        <div id="simActions" class="sim-actions"></div>
        <div id="simStats" class="sim-stats"></div>
        <canvas id="simCanvas" aria-label="객실 평면도. 출구를 눌러 확인하고 조작합니다."></canvas>
        <div class="sim-legend muted small">
          <span><i style="background:#cfe0ff"></i>착석</span><span><i style="background:#fff"></i>이동</span><span><i style="background:#eb463c"></i>부상</span><span><i class="ring"></i>짐 챙김</span>
          <span><i class="sq" style="background:#50d278"></i>개방</span><span><i class="sq" style="background:#eb463c"></i>차단</span>
        </div>
      </div>
      <aside class="sim-panel">
        <h2 id="simTitle" class="q-title"></h2>
        <div id="simText" class="sim-text"></div>
        <ol id="simLog" class="sim-log"></ol>
      </aside>
    </div>
    <div id="simDebrief" class="sim-debrief hidden"></div>
  </section>

  <!-- 시뮬레이션: 출구 확인 -->
  <div id="simExit" class="modal hidden" role="dialog" aria-modal="true" aria-labelledby="seTitle">
    <div class="sheet">
      <div class="q-head"><span class="pill yel">출구</span><span class="muted" id="seState"></span></div>
      <h2 id="seTitle" class="q-title"></h2>
      <div id="seLook" class="se-look"></div>
      <div id="seActions" class="options"></div>
      <p id="seNote" class="muted small"></p>
      <p class="muted small">이 창이 열려 있는 동안 시뮬레이션은 잠시 멈춥니다.</p>
      <button id="seClose" class="btn ghost wide-sm">닫기</button>
    </div>
  </div>

  <!-- 플레이어 -->
  <section id="player" class="screen hidden">
    <header class="top">
      <button id="backBtn" class="icon-btn" aria-label="목록으로">← 목록</button>
      <div class="player-title" id="playerTitle"></div>
      <span class="orient" id="orientLabel"></span>
    </header>
    <div class="video-wrap">
      <video id="video" playsinline preload="auto"></video>
      <button id="bigPlay" class="big-play" aria-label="재생">▶</button>
    </div>
    <div class="progress" aria-hidden="true">
      <div class="bar"><div id="bar" class="fill"></div></div>
      <div id="marks" class="marks"></div>
    </div>
    <div class="controls">
      <button id="playBtn" class="btn ghost">재생</button>
      <span id="time" class="muted mono">0:00 / 0:00</span>
      <button id="muteBtn" class="btn ghost" aria-pressed="false">소리 켜짐</button>
      <span id="quizCount" class="pill"></span>
    </div>
  </section>

  <!-- 퀴즈 모달 -->
  <div id="quiz" class="modal hidden" role="dialog" aria-modal="true" aria-labelledby="qTitle">
    <div class="sheet">
      <div class="q-head"><span class="pill yel" id="qNo"></span><span class="muted" id="qTopic"></span></div>
      <h2 id="qTitle" class="q-title"></h2>
      <div id="qOptions" class="options"></div>
      <div id="qFeedback" class="feedback hidden"></div>
      <button id="qNext" class="btn primary hidden">해설 확인 · 이어보기</button>
    </div>
  </div>

  <!-- 학습 정리 -->
  <section id="result" class="screen hidden">
    <header class="top">
      <button id="homeBtn" class="icon-btn">← 목록</button>
      <div class="player-title">학습 정리</div>
      <span></span>
    </header>
    <div id="badge" class="badge hidden">사고사례 #01 이수</div>
    <h1 class="h1" id="scoreLine"></h1>
    <div id="oxList" class="ox-list"></div>

    <h2 class="h2">핵심 교훈</h2>
    <div class="cards-wrap">
      <button id="cardPrev" class="icon-btn" aria-label="이전 카드">‹</button>
      <div id="card" class="card"></div>
      <button id="cardNext" class="icon-btn" aria-label="다음 카드">›</button>
    </div>
    <div id="cardDots" class="dots"></div>

    <h2 class="h2">비상탈출 구령 연습</h2>
    <div class="drill">
      <div class="cmd" id="cmdText"></div>
      <div class="muted" id="cmdEn"></div>
      <button id="cmdSpeak" class="btn ghost">구령 듣기</button>
    </div>

    <button id="replayBtn" class="btn ghost wide">처음부터 다시 보기</button>
  </section>

  <!-- 설정 -->
  <div id="settings" class="modal hidden" role="dialog" aria-modal="true">
    <div class="sheet">
      <h2 class="q-title">설정</h2>
      <label class="row"><input type="checkbox" id="optVibrate"> 충돌 장면 진동 효과</label>
      <label class="row"><input type="checkbox" id="optSoftImpact"> 충돌음 작게 (큰 소리가 부담될 때)</label>
      <label class="row"><input type="checkbox" id="optSfx"> 퀴즈 효과음</label>
      <p class="muted small">처음 수강할 때는 앞으로 건너뛸 수 없습니다. 이수한 뒤에는 진행 바를 눌러 원하는 장면으로 이동할 수 있습니다.</p>
      <button id="settingsClose" class="btn primary">닫기</button>
    </div>
  </div>

  <script src="js/cases.js"></script>
  <script src="js/app.js"></script>
  <script src="js/sim.js"></script>
  <script src="js/chat.js"></script>
</body>
</html>
